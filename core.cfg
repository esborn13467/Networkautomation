vlan 10
   name ADMIN
vlan 20
   name STAFF
vlan 30
   name GUEST
vlan 99
   name QUARANTINE
vlan 999
   name NATIVE_UNUSED
ip routing
ip access-list GUEST_ACL
   counters per-entry
   10 permit udp any eq bootpc any eq bootps
   20 deny ip 10.10.30.0/24 10.10.10.0/24
   30 deny ip 10.10.30.0/24 10.10.20.0/24
   40 deny ip 10.10.30.0/24 10.10.99.0/24
   50 permit ip 10.10.30.0/24 any
ip access-list QUARANTINE_ACL
   counters per-entry
   10 permit udp 10.10.99.0/24 host 10.10.10.5 eq 1812
   20 permit ip 10.10.99.0/24 host 10.10.10.20
   30 deny ip any any
interface Vlan10
   ip address 10.10.10.1/24
interface Vlan20
   ip address 10.10.20.1/24
interface Vlan30
   ip address 10.10.30.1/24
interface Vlan99
   ip address 10.10.99.1/24
interface Ethernet1
   switchport mode trunk
   switchport trunk native vlan 999
   switchport trunk allowed vlan 10,20,30,99
interface Ethernet3
   no switchport
   ip address 10.10.0.1/30
ip route 0.0.0.0/0 10.10.0.2
