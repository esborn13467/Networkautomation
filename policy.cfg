ip access-list ZT_POLICY
   counters per-entry
   10 permit udp any eq bootpc any eq bootps
   20 permit udp 10.10.99.0/24 host 10.10.10.5 eq 1812
   30 permit ip 10.10.99.0/24 host 10.10.10.20
   40 deny ip 10.10.99.0/24 any
   50 deny ip 10.10.30.0/24 10.10.10.0/24
   60 deny ip 10.10.30.0/24 10.10.20.0/24
   70 deny ip 10.10.30.0/24 10.10.99.0/24
   80 permit ip any any
interface Ethernet1
   ip access-group ZT_POLICY in
