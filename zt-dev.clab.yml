name: zt
topology:
  kinds:
    arista_ceos:
      image: ceos:4.36.2F
    linux:
      image: zt-node:3
      memory: 256MB
  nodes:
    core: {kind: arista_ceos}
    acc1: {kind: arista_ceos}
    edge:
      kind: linux
      binds:
        - ./edge-fw.sh:/tmp/edge-fw.sh
      exec:
        - ip addr add 10.10.0.2/30 dev eth1
        - ip addr add 10.10.40.1/24 dev eth2
        - ip link set eth1 mtu 1500 up
        - ip link set eth2 mtu 1500 up
        - sysctl -w net.ipv4.ip_forward=1
        - ip route add 10.10.10.0/24 via 10.10.0.1
        - ip route add 10.10.20.0/24 via 10.10.0.1
        - ip route add 10.10.30.0/24 via 10.10.0.1
        - ip route add 10.10.99.0/24 via 10.10.0.1
        - sh /tmp/edge-fw.sh
    web:
      kind: linux
      exec:
        - ip addr add 10.10.40.10/24 dev eth1
        - ip link set eth1 mtu 1500 up
        - ip route replace default via 10.10.40.1
        - sh -c "mkdir -p /srv/www; echo ZT-DMZ-web-server > /srv/www/index.html; cd /srv/www; nohup python3 -m http.server 80 > /dev/null 2>&1 &"
    radius:
      kind: linux
      binds:
        - ./radius/clients.conf:/etc/freeradius/3.0/clients.conf
        - ./radius/users:/etc/freeradius/3.0/users
      exec:
        - ip addr add 10.10.10.5/24 dev eth1
        - ip link set eth1 mtu 1500 up
        - ip route replace default via 10.10.10.1
        - touch /etc/freeradius/3.0/zt_dynamic
        - sh -c "nohup freeradius -X > /tmp/radius.log 2>&1 &"
    siem:
      kind: linux
      exec:
        - ip addr add 10.10.10.20/24 dev eth1
        - ip link set eth1 mtu 1500 up
        - ip route replace default via 10.10.10.1
    admin-pc:
      kind: linux
      binds: ["./client/admin-pc.conf:/etc/wpa.conf"]
      exec: ["ip link set eth1 mtu 1500 up", "sh -c \"echo nameserver 1.1.1.1 > /etc/resolv.conf\""]
    staff-pc:
      kind: linux
      binds: ["./client/staff-pc.conf:/etc/wpa.conf"]
      exec: ["ip link set eth1 mtu 1500 up", "sh -c \"echo nameserver 1.1.1.1 > /etc/resolv.conf\""]
    guest-pc:
      kind: linux
      binds: ["./client/guest-pc.conf:/etc/wpa.conf"]
      exec: ["ip link set eth1 mtu 1500 up", "sh -c \"echo nameserver 1.1.1.1 > /etc/resolv.conf\""]
    # A new desk: cabled to acc1 port 7 but UNPLUGGED (link down) and its user (carol)
    # has no RADIUS account yet. Used in the "add a new PC" exercise of the guide.
    new-pc:
      kind: linux
      binds: ["./client/new-pc.conf:/etc/wpa.conf"]
      exec: ["ip link set eth1 mtu 1500", "ip link set eth1 down", "sh -c \"echo nameserver 1.1.1.1 > /etc/resolv.conf\""]
  links:
    - endpoints: ["core:eth1", "acc1:eth1"]
    - endpoints: ["core:eth3", "edge:eth1"]
    - endpoints: ["edge:eth2", "web:eth1"]
    - endpoints: ["acc1:eth2", "admin-pc:eth1"]
    - endpoints: ["acc1:eth3", "staff-pc:eth1"]
    - endpoints: ["acc1:eth4", "guest-pc:eth1"]
    - endpoints: ["acc1:eth5", "radius:eth1"]
    - endpoints: ["acc1:eth6", "siem:eth1"]
    - endpoints: ["acc1:eth7", "new-pc:eth1"]
